<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>مرجع الزيارات | Ahmad Alshehri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --navy: #08131f;
      --navy-soft: #10263b;
      --gold: #d5aa5a;
      --gold-soft: #f0d89e;
      --text: #f8f3e9;
      --muted: rgba(248, 243, 233, .58);
      --line: rgba(255, 255, 255, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", sans-serif;
      background:
        radial-gradient(circle at 75% 15%, rgba(213,170,90,.18), transparent 28%),
        radial-gradient(circle at 15% 85%, rgba(71,111,153,.15), transparent 30%),
        linear-gradient(135deg, #06101a, var(--navy) 52%, var(--navy-soft));
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .055;
      background-image:
        linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.18) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    main { position: relative; width: min(620px, 100%); }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--gold-soft);
      font: 700 .72rem Manrope, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 28px; font-size: clamp(1.55rem, 4vw, 2.25rem); line-height: 1.25; }
    .card {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 30px 90px rgba(0,0,0,.34);
      backdrop-filter: blur(18px);
    }
    .card::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .label { margin: 0; color: var(--muted); font-size: .94rem; }
    .count {
      min-height: 1.12em;
      margin: 12px 0 8px;
      direction: ltr;
      text-align: right;
      color: var(--gold-soft);
      font: 800 clamp(4rem, 18vw, 7.5rem)/1 Manrope, sans-serif;
      letter-spacing: -.065em;
    }
    .note { margin: 0; color: var(--muted); font-size: .78rem; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 28px; color: var(--muted); font-size: .75rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 6px rgba(213,170,90,.1); }
    .error { color: #f3b8b8; font-size: 1rem; letter-spacing: 0; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <p class="eyebrow">Private reference dashboard</p>
    <h1 id="page-title">مرجع زيارات الموقع</h1>
    <section class="card" aria-live="polite" aria-busy="true" id="counterCard">
      <p class="label">إجمالي الزوار المسجلين</p>
      <div class="count" id="visitorCount">—</div>
      <p class="note">رقم مرجعي تقريبي · زيارة واحدة لكل ملف متصفح</p>
      <div class="status"><span class="dot"></span><span id="statusText">جارٍ تحديث الرقم…</span></div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      var endpoint = 'https://ahmadalshehri.goatcounter.com/counter/TOTAL.json';
      var count = document.getElementById('visitorCount');
      var status = document.getElementById('statusText');
      var card = document.getElementById('counterCard');

      fetch(endpoint, { cache: 'no-store', credentials: 'omit' })
        .then(function (response) {
          if (!response.ok) throw new Error('Counter unavailable');
          return response.json();
        })
        .then(function (data) {
          count.textContent = data.count || '0';
          status.textContent = 'آخر تحديث: ' + new Intl.DateTimeFormat('ar-SA', {
            dateStyle: 'medium', timeStyle: 'short'
          }).format(new Date());
          card.setAttribute('aria-busy', 'false');
        })
        .catch(function () {
          count.textContent = 'غير متاح';
          count.classList.add('error');
          status.textContent = 'فعّل إظهار عداد الزوار من إعدادات GoatCounter';
          card.setAttribute('aria-busy', 'false');
        });
    })();
  </script>
</body>
</html>
