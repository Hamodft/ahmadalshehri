name: Fix Job Radar Empty State

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-job-radar-empty.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix filters and zero-result fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cv-studio/jobs.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<option value="65">65%+</option><option value="75" selected>75%+</option><option value="85">85%+</option><option value="90">90%+</option>', '<option value="0">All match scores</option><option value="55">55%+</option><option value="65" selected>65%+</option><option value="75">75%+</option><option value="85">85%+</option><option value="90">90%+</option>') if '<option value="0">All match scores</option><option value="65">65%+</option><option value="75" selected>75%+</option>' not in s else s.replace('<option value="0">All match scores</option><option value="65">65%+</option><option value="75" selected>75%+</option><option value="85">85%+</option><option value="90">90%+</option>', '<option value="0">All match scores</option><option value="55">55%+</option><option value="65" selected>65%+</option><option value="75">75%+</option><option value="85">85%+</option><option value="90">90%+</option>')
          s=s.replace('Default threshold:</span><span class="ar">حد التطابق:</span> <b>75%</b>', 'Default threshold:</span><span class="ar">حد التطابق:</span> <b>65%</b>')

          marker="setLang(lang);$('langBtn').onclick=function(){setLang(lang==='en'?'ar':'en')};"
          injected=marker+"\n// Safari may restore old form values (for example 90% and LinkedIn) from page cache. Always start Job Radar with useful defaults.\n$('threshold').value='65';\nsource='all';\nArray.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('active',t.dataset.source==='all')});"
          if "Safari may restore old form values" not in s:
              if marker not in s: raise SystemExit('language marker not found')
              s=s.replace(marker,injected,1)

          old="if(!list.length){$('jobs').innerHTML='<div class=\"empty\"><b>'+(lang==='ar'?'لا توجد نتائج ضمن الفلتر الحالي.':'No jobs match the current filters.')+'</b>'+(lang==='ar'?'خفّض نسبة التطابق أو جرّب كلمة بحث أخرى.':'Lower the match threshold or try another keyword.')+'</div>';return}"
          new="if(!list.length){var fallback=jobs.map(function(j){var s=score(j);j._score=s.value;j._reasons=s.reasons;return j}).filter(function(j){if(source!=='all'&&j.source!==source)return false;if(q&&clean((j.title||'')+' '+(j.description||'')+' '+(j.company||'')+' '+(j.location||'')).indexOf(q)===-1)return false;return true}).sort(function(a,b){return b._score-a._score}).slice(0,12);if(fallback.length){list=fallback;$('status').innerHTML=lang==='ar'?(fallback.length+' أفضل فرص متاحة'):(fallback.length+' best available matches');$('visibleCount').textContent=fallback.length;}else{$('jobs').innerHTML='<div class=\"empty\"><b>'+(lang==='ar'?'لا توجد وظائف في هذا المصدر الآن.':'No jobs are available from this source right now.')+'</b>'+(lang==='ar'?'اختر All Jobs أو حدّث الصفحة لاحقًا.':'Choose All Jobs or refresh again later.')+'</div>';return}}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'best available matches' not in s:
              raise SystemExit('empty-state marker not found')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cv-studio/jobs.html
          git diff --cached --quiet || git commit -m "Fix Job Radar zero-results UX"
          git pull --rebase origin main
          git push
