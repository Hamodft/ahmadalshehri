name: Simplify Job Radar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/simplify-job-radar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove manual search and match filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cv-studio/jobs.html')
          s=p.read_text(encoding='utf-8')

          # Replace toolbar with a single sort control. This private page should show all CV-relevant jobs directly.
          start=s.find('<div class="toolbar">')
          end=s.find('</div>\n<div class="tabs"', start)
          if start!=-1 and end!=-1:
              toolbar='''<div class="toolbar" style="grid-template-columns:1fr"><select class="control" id="sort"><option value="score">Best match</option><option value="new">Newest first</option></select></div>'''
              s=s[:start]+toolbar+s[end+6:]

          # Remove the visible threshold stat from the hero.
          s=s.replace('<span class="stat"><span class="en">Default threshold:</span><span class="ar">حد التطابق:</span> <b>65%</b></span>','')
          s=s.replace('<span class="stat"><span class="en">Default threshold:</span><span class="ar">حد التطابق:</span> <b>75%</b></span>','')

          # Make the page description explicit: it already pre-filters based on CV relevance.
          s=s.replace('Best-fit jobs, ranked for your CV.','Jobs that fit your CV — ready to review.')
          s=s.replace('الوظائف الأقرب لسيرتك، مرتبة حسب التطابق.','الوظائف المتماشية مع سيرتك — جاهزة للمراجعة.')

          # Remove old Safari/default-filter initialization if present.
          s=s.replace("// Safari may restore old form values (for example 90% and LinkedIn) from page cache. Always start Job Radar with useful defaults.\n$('threshold').value='65';\nsource='all';\nArray.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('active',t.dataset.source==='all')});", "source='all';\nArray.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('active',t.dataset.source==='all')});")

          # Replace render() preamble so there is no keyword or score threshold filtering.
          old="function render(){var q=clean($('query').value),min=+$('threshold').value;var list=jobs.map(function(j){var s=score(j);j._score=s.value;j._reasons=s.reasons;return j}).filter(function(j){if(source!=='all'&&j.source!==source)return false;if(j._score<min)return false;if(q&&clean((j.title||'')+' '+(j.description||'')+' '+(j.company||'')+' '+(j.location||'')).indexOf(q)===-1)return false;return true});"
          new="function render(){var list=jobs.map(function(j){var s=score(j);j._score=s.value;j._reasons=s.reasons;return j}).filter(function(j){if(source!=='all'&&j.source!==source)return false;return true});"
          if old in s:
              s=s.replace(old,new,1)
          else:
              # Handle previously patched version with fallback logic; rewrite the function preamble using a regex-safe split.
              marker='function render(){'
              pos=s.find(marker)
              sortpos=s.find("list.sort($('sort').value", pos)
              if pos!=-1 and sortpos!=-1:
                  s=s[:pos]+new+s[sortpos:]

          # Remove old zero-results fallback based on hidden q/min variables and replace with source-only empty state.
          import re
          s=re.sub(r"if\(!list\.length\)\{var fallback=[\s\S]*?return\}\}", "if(!list.length){$('jobs').innerHTML='<div class=\"empty\"><b>'+(lang==='ar'?'لا توجد وظائف في هذا المصدر الآن.':'No jobs are available from this source right now.')+'</b>'+(lang==='ar'?'جرّب All Jobs أو عد لاحقًا بعد التحديث القادم.':'Try All Jobs or check again after the next refresh.')+'</div>';return}", s, count=1)
          s=s.replace("if(!list.length){$('jobs').innerHTML='<div class=\"empty\"><b>'+(lang==='ar'?'لا توجد نتائج ضمن الفلتر الحالي.':'No jobs match the current filters.')+'</b>'+(lang==='ar'?'خفّض نسبة التطابق أو جرّب كلمة بحث أخرى.':'Lower the match threshold or try another keyword.')+'</div>';return}", "if(!list.length){$('jobs').innerHTML='<div class=\"empty\"><b>'+(lang==='ar'?'لا توجد وظائف في هذا المصدر الآن.':'No jobs are available from this source right now.')+'</b>'+(lang==='ar'?'جرّب All Jobs أو عد لاحقًا بعد التحديث القادم.':'Try All Jobs or check again after the next refresh.')+'</div>';return}")

          # Remove event handlers for controls that no longer exist.
          s=s.replace("$('query').oninput=render;$('threshold').onchange=render;$('sort').onchange=render;", "$('sort').onchange=render;")

          # Remove wording that suggests a match threshold is part of the UX.
          s=s.replace('Match scores are relevance estimates based on the verified career data used by CV Studio. The radar does not log in to your job-platform accounts and cannot guarantee every posting on a platform; it tracks public/indexed job pages only.', 'Jobs shown here are already selected for relevance to the verified career data used by CV Studio. Match scores are only a ranking aid. The radar does not log in to your job-platform accounts and tracks public/indexed job pages only.')
          s=s.replace('نسب التطابق تقديرية وتعتمد على بياناتك المهنية الموثقة المستخدمة في CV Studio. الرادار لا يسجل الدخول إلى حساباتك في منصات التوظيف ولا يضمن ظهور كل إعلان في المنصة؛ بل يتابع الإعلانات العامة والمفهرسة فقط.', 'الوظائف المعروضة هنا مختارة مسبقًا لارتباطها ببياناتك المهنية الموثقة في CV Studio، ونسبة التطابق تستخدم فقط لترتيب الأفضل. الرادار لا يسجل الدخول إلى حساباتك ويتابع الإعلانات العامة والمفهرسة فقط.')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish simplified Job Radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cv-studio/jobs.html
          git diff --cached --quiet || git commit -m "Simplify Job Radar for private use"
          git pull --rebase origin main
          git push
