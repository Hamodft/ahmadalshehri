name: One-time CV layout repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cv-layout-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-cv-layout-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair CV renderers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('cv.html'), Path('tailored-cv-render.html')]
          contact_fix = ".contact div>*{min-width:0}.contact div span:last-child{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}.sec-ar .contact div span:last-child{unicode-bidi:plaintext}"

          for path in files:
              s = path.read_text(encoding='utf-8')

              # Remove the QR from the generated CV markup completely.
              s, qr_count = re.subn(r"^var qr=.*?;$", "var qr='';", s, count=1, flags=re.MULTILINE)
              if qr_count != 1:
                  raise SystemExit(f'Could not find QR renderer in {path}')

              # Prevent long email/LinkedIn values from escaping the A4 contact column,
              # including RTL Arabic exports.
              if contact_fix not in s:
                  marker = '@media(max-width:820px)'
                  if marker not in s:
                      raise SystemExit(f'Could not find responsive CSS marker in {path}')
                  s = s.replace(marker, contact_fix + '\n' + marker, 1)

              path.write_text(s, encoding='utf-8')
          PY

      - name: Install PDF browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start portfolio
        run: python3 -m http.server 4173 >/tmp/cv-server.log 2>&1 &

      - name: Regenerate Arabic and English PDFs
        run: node scripts/generate-cv.mjs

      - name: Publish permanent fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cv.html tailored-cv-render.html downloads/Ahmad-Alshehri-CV-en.pdf downloads/Ahmad-Alshehri-CV-ar.pdf
          git diff --cached --quiet || git commit -m "Fix CV contact layout and remove QR"
          git push
