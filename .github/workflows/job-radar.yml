name: Refresh Job Radar

on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-job-radar.mjs"
      - ".github/workflows/job-radar.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public indexed jobs
        run: node scripts/refresh-job-radar.mjs
      - name: Publish Job Radar feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cv-studio/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Job Radar feed"
            git pull --rebase origin main
            git push
          fi
