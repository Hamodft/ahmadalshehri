name: Reweight Job Fit Description First

on:
  push:
    branches: [main]
    paths:
      - "scripts/reweight-job-fit.mjs"
      - ".github/workflows/reweight-job-fit-description-first.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reweight fit score
        run: node scripts/reweight-job-fit.mjs
      - name: Publish weighting change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cv-studio/jobs.html
          if ! git diff --cached --quiet; then
            git commit -m "Prioritize job description in fit scoring"
            git pull --rebase origin main
            git push
          fi
