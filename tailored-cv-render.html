<style>
:root{--ink:#171b22;--text:#4e535b;--muted:#777c84;--line:#b9bcc1;--soft:#eef0f2;--accent:#ad7d2e;--display:'Manrope',sans-serif;--body:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#292d33;color:var(--ink);font-family:var(--body);font-size:8.45pt;line-height:1.34}

.top{display:grid;grid-template-columns:25mm minmax(0,1fr) 50mm;gap:6mm;align-items:center;margin-bottom:6mm}.photo{width:25mm;height:25mm;border-radius:50%;object-fit:cover;object-position:center 20%;filter:grayscale(100%);border:1px solid #ddd}.name h1{margin:0;font:500 21.5pt/1 var(--display);letter-spacing:.045em;text-transform:uppercase}.name h1 strong{display:block;font-weight:800}.name p{max-width:92mm;margin:4px 0 0;color:var(--muted);font:600 7.1pt/1.42 var(--display);letter-spacing:.075em;text-transform:uppercase}.contact{font-size:7.35pt;color:var(--text);line-height:1.55}.contact div{display:grid;grid-template-columns:11mm minmax(0,1fr);gap:2.5mm;align-items:start;margin:.35mm 0}.ico{color:var(--muted);font:700 5.8pt/1.7 var(--display);letter-spacing:.055em;width:auto}
.layout{display:grid;grid-template-columns:55mm minmax(0,1fr);gap:9mm;align-items:start}.side{padding-top:0}.main{min-width:0}.section{margin-bottom:5mm}.section:last-child{margin-bottom:0}
h2{position:relative;font:700 10.2pt var(--display);letter-spacing:.18em;text-transform:uppercase;margin:0 0 3.2mm;padding-bottom:1.7mm;border-bottom:1px solid var(--line)}h2:after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:12mm;height:1.5px;background:var(--accent)}p{margin:0;color:var(--text)}

.timeline{position:relative;padding-inline-start:5mm}.timeline:before{content:"";position:absolute;inset-inline-start:1mm;top:2mm;bottom:1mm;width:1px;background:#8d9197}.job{position:relative;margin-bottom:3.2mm;break-inside:avoid;page-break-inside:avoid}.job:before{content:"";position:absolute;inset-inline-start:-4.7mm;top:1.2mm;width:2.1mm;height:2.1mm;background:#fff;border:1.2px solid var(--ink);border-radius:50%}.job-head{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}.job-title{font:700 8.55pt var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}.when{white-space:nowrap;font:600 6.9pt var(--display);letter-spacing:.055em;color:var(--muted)}.company{font:600 7.15pt var(--display);letter-spacing:.055em;text-transform:uppercase;color:var(--text);margin:.65mm 0}.job ul{list-style:none;padding:0;margin:0}.job li{position:relative;padding-inline-start:2.5mm;margin:.55mm 0;color:var(--text);font-size:7.45pt;line-height:1.3}.job li:before{content:"•";position:absolute;inset-inline-start:0;color:var(--ink)}
.list{list-style:none;margin:0;padding:0}.list li{padding:1.05mm 0;color:var(--text);font-size:7.7pt}.lang{margin-bottom:2.7mm}.lang b{display:block;font:600 7.8pt var(--display)}.track{height:1px;background:#c9ccd0;margin-top:1.2mm}.track i{display:block;height:2px;background:var(--ink);margin-top:-1px}
.edu b,.cert b{display:block;font:700 7.8pt var(--display);color:var(--ink)}.edu span,.cert span{color:var(--muted);font-size:7.15pt}.cert{margin-bottom:2.5mm}.cert-provider,.cert-date{display:block}.cert-date{margin-top:.3mm;color:var(--accent)!important;white-space:nowrap}.skills{columns:1}.skills li{break-inside:avoid;border-bottom:1px solid #d7d9dc;padding:1mm 0;font-size:7.45pt}
.scope-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4mm 2mm}.scope-item{padding:1.5mm 2mm;background:#faf8f4;border-inline-start:1.5px solid var(--accent);font:600 7.2pt/1.25 var(--display);color:var(--text)}.skill-group{margin-bottom:2.5mm}.skill-group:last-child{margin-bottom:0}.skill-group b{display:block;margin-bottom:.7mm;color:var(--accent);font:700 6.2pt var(--display);letter-spacing:.08em;text-transform:uppercase}.timeline:before{background:#b89a63}.job:before{border-color:var(--accent)}
.qr-foot{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:3mm;width:100%;min-height:19mm;margin-top:4mm;padding-top:2mm;border-top:1px solid var(--soft);background:#fff}.qr-foot img{display:block;width:17mm;height:17mm;padding:.8mm;border:1px solid #d9d5cd;background:#fff}.qr-copy{max-width:31mm;text-align:end}.qr-copy b{display:block;color:var(--ink);font:700 6.4pt/1.35 var(--display);letter-spacing:.065em;text-transform:uppercase}.qr-copy small{display:block;margin-top:.8mm;color:var(--accent);font:600 5.7pt/1.3 var(--body)}
.note{font-size:6.6pt;color:#8a8e94;margin-top:2mm}.sec-ar{direction:rtl;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif}.sec-ar *{letter-spacing:0!important}.sec-ar .contact div{flex-direction:row}.sec-ar .name h1{text-transform:none}.sec-ar .name p{text-transform:none}
.contact div>*{min-width:0}.contact div span:last-child{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}.sec-ar .contact div span:last-child{unicode-bidi:plaintext}
@media(max-width:820px){.page{width:auto;height:auto;min-height:0;margin:10px;padding:22px}.top{grid-template-columns:65px 1fr}.photo{width:65px;height:65px}.contact{grid-column:1/-1}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:20px}.side .section{margin:0}}
html.cv-export-a4,html.cv-export-a4 body{width:210mm!important;min-width:210mm!important;margin:0!important;padding:0!important;background:#fff!important}html.cv-export-a4 #out{width:210mm!important;margin:0!important}html.cv-export-a4 .page{display:block!important;width:210mm!important;min-width:210mm!important;height:296.8mm!important;min-height:296.8mm!important;max-height:296.8mm!important;margin:0!important;padding:9mm 10mm 7mm!important;box-shadow:none!important;overflow:hidden!important}html.cv-export-a4 .top{display:grid!important;grid-template-columns:25mm minmax(0,1fr) 50mm!important;gap:5mm!important;align-items:center!important;margin-bottom:5mm!important}html.cv-export-a4 .photo{display:block!important;width:25mm!important;height:25mm!important}html.cv-export-a4 .contact{grid-column:auto!important}html.cv-export-a4 .layout{display:grid!important;grid-template-columns:55mm minmax(0,1fr)!important;gap:8mm!important;align-items:start!important}html.cv-export-a4 .side{display:block!important;padding:0!important}html.cv-export-a4 .side .section{display:block!important;margin-bottom:4mm!important}html.cv-export-a4 .main{display:block!important;min-width:0!important}html.cv-export-a4 .qr-foot{display:flex!important;width:100%!important;min-height:18mm!important;margin:3mm 0 0!important;padding-top:2mm!important}
html.cv-export-a4 .top>*,html.cv-export-a4 .layout>*,html.cv-export-a4 .contact div>*,html.cv-export-a4 .job-head>*{min-width:0!important}html.cv-export-a4 .contact{font-size:6.65pt!important}html.cv-export-a4 .contact div{grid-template-columns:10mm minmax(0,1fr)!important;gap:1.6mm!important}html.cv-export-a4 .contact div span:last-child{overflow-wrap:anywhere!important;word-break:break-word!important}html.cv-export-a4 .job-title{overflow-wrap:anywhere!important}html.cv-export-a4 .when{flex-shrink:0!important}html.cv-export-a4 .qr-foot{max-width:100%!important;padding-inline-end:0!important}html.cv-export-a4[dir="rtl"] .contact div span:last-child{unicode-bidi:plaintext}

@media print{html,body{height:auto!important;background:#fff;overflow:visible!important}.page{display:block!important;width:210mm!important;height:268mm!important;min-height:268mm!important;max-height:268mm!important;margin:0!important;padding:9mm 10mm 5mm!important;box-shadow:none!important;overflow:hidden!important;page-break-before:avoid!important;page-break-after:avoid!important;break-before:avoid!important;break-after:avoid!important}.top{display:grid!important;grid-template-columns:25mm minmax(0,1fr) 50mm!important;gap:6mm!important;margin-bottom:6mm!important}.photo{width:25mm!important;height:25mm!important}.contact{grid-column:auto!important}.layout{display:grid!important;grid-template-columns:55mm minmax(0,1fr)!important;gap:9mm!important;align-items:start!important}.side{display:block!important;padding:0!important}.side .section{margin-bottom:5mm!important}.main{display:block!important}.job{break-inside:avoid!important;page-break-inside:avoid!important}.qr-foot{position:relative!important;inset:auto!important;bottom:auto!important;width:100%!important;min-height:18mm!important;margin:3mm 0 0!important;padding-top:2mm!important;break-inside:avoid!important;page-break-inside:avoid!important}@page{size:A4;margin:0}}
</style></head>
<body><main id="out"></main>
<script>
(function(){'use strict';
var FILES=['profile','settings','experience','achievements','skills','certifications','education','languages'],D={},T=null,L='en';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(v,l){l=l||L;return v==null?'':typeof v==='string'?v:(v[l]||v.en||v.ar||'')}
function vis(a){return(a||[]).filter(function(x){return x.visible!==false}).sort(function(a,b){return(a.order||0)-(b.order||0)})}
function uniq(a){var s={};return a.filter(function(x){var k=x.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');if(!k||s[k])return false;s[k]=1;return true})}
function score(s){var n=0;s=String(s||'');if(/\d|%|KSA|national|regional|المملكة|إقليمي/.test(s))n+=5;if(/achiev|lead|manage|deliver|build|launch|تحقيق|قياد|إدار|إطلاق/i.test(s))n+=3;return n-Math.floor(s.length/170)}
function fallbackBullets(r,l,max){var a=[];(r.achievements||[]).forEach(function(x){a.push(t(x,l))});(((r.responsibilities||{})[l])||[]).forEach(function(x){a.push(x)});return uniq(a).sort(function(a,b){return score(b)-score(a)}).slice(0,max)}
function bullets(r,l,max){var idx=T&&T.bulletSelection&&T.bulletSelection[r.id],arr=((r.responsibilities||{})[l])||[];if(idx&&idx.length){var picked=idx.map(function(i){return arr[i]}).filter(Boolean).slice(0,max);if(picked.length)return picked}return fallbackBullets(r,l,max)}
function metrics(l){var out=[];vis(D.achievements.items).forEach(function(x){if(out.length>=3)return;var v=x.value||'';if(x.auto==='years')v=new Date().getFullYear()-(+D.settings.metrics.experienceStartYear||2020);if(x.auto==='trainingHours')v=vis(D.certifications.items).reduce(function(s,c){return s+(+c.hours||0)},0);out.push({v:String(v),unit:t(x.unit,l),label:t(x.title,l)})});return out}
function section(title,body,cl){return'<section class="section '+(cl||'')+'"><h2>'+title+'</h2>'+body+'</section>'}
function byIds(list,ids){var map={};(list||[]).forEach(function(x){map[x.id]=x});return(ids||[]).map(function(id){return map[id]}).filter(Boolean)}
function render(l){L=l;var ar=l==='ar',p=D.profile,c=p.contact,roles=vis(D.experience.items),labels=ar?{about:'نبذة مهنية',scope:'نطاق العمل الأساسي',impact:'أبرز النتائج',exp:'الخبرات العملية',skills:'المهارات',edu:'التعليم',cert:'التطوير المهني',langs:'اللغات',commercial:'التجاري والعمليات',leadership:'التدريب والقيادة'}:{about:'About Me',scope:'Core Scope',impact:'Career Highlights',exp:'Work Experience',skills:'Skills',edu:'Education',cert:'Professional Development',langs:'Languages',commercial:'Commercial & Operations',leadership:'Training & Leadership'};
var contact=[[ar?'الموقع':'LOCATION',t(c.location,l)],[ar?'الهاتف':'PHONE',c.phone],[ar?'البريد':'EMAIL',c.email],[ar?'لينكدإن':'LINKEDIN',c.linkedin]].filter(function(x){return x[1]}).map(function(x){return'<div><span class="ico">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>'}).join('');
var defaultHeadline=ar?['عمليات المبيعات وإدارة القوى الميدانية','التدريب وتطوير القدرات']:['Sales Operations & Field Force Management','Training & Capability Development'];
var headline=(T&&T.headline&&T.headline[l]&&T.headline[l].length?T.headline[l]:defaultHeadline);
var top='<header class="top"><img class="photo" src="'+esc(p.photo||'')+'" alt=""><div class="name"><h1>'+esc(t(p.name,l)).replace(' ',' <strong>')+'</strong><p>'+headline.map(esc).join('<br>')+'</p></div><div class="contact">'+contact+'</div></header>';
var metricLabels=ar?['سنوات خبرة مهنية','متوسط تحقيق المستهدف في 2024','ترقيات مهنية داخل HONOR']:['Years of Professional Experience','Average Target Achievement in 2024','Career Promotions at HONOR'];
var allSkills=vis(D.skills.items),commercial=T?byIds(allSkills,T.commercialSkillIds):allSkills.filter(function(x){return /cat-[12]/.test(x.categoryKey||'')}).slice(0,4),leadership=T?byIds(allSkills,T.leadershipSkillIds):allSkills.filter(function(x){return /cat-[34]/.test(x.categoryKey||'')}).slice(0,4);
function skillGroup(title,items){return'<div class="skill-group"><b>'+title+'</b><ul class="list skills">'+items.slice(0,4).map(function(x){return'<li>'+esc(t(x.name,l))+'</li>'}).join('')+'</ul></div>'}
var certs=T?byIds(vis(D.certifications.items),T.certIds):vis(D.certifications.items).sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,2);
var side=section(labels.impact,metrics(l).map(function(m,i){var symbol=/^[+%٪]$/.test(String(m.unit).trim()),unit=i===2?'':m.unit;return'<div class="metric"><strong><em>'+esc(m.v)+(symbol?esc(unit):'')+'</em>'+(!symbol&&unit?'<small>'+esc(unit)+'</small>':'')+'</strong><span>'+esc(metricLabels[i]||m.label)+'</span></div>'}).join(''))+
section(labels.skills,skillGroup(labels.commercial,commercial)+skillGroup(labels.leadership,leadership))+
section(labels.langs,vis(D.languages.items).map(function(x,i){return'<div class="lang"><b>'+esc(t(x.name,l))+'</b><span>'+esc(t(x.level,l))+'</span><div class="track"><i style="width:'+(i?78:100)+'%"></i></div></div>'}).join(''))+
section(labels.edu,vis(D.education.items).map(function(x){return'<div class="edu"><b>'+esc(t(x.program,l))+'</b><span>'+esc(t(x.institution,l))+'<br>'+esc(t(x.status,l))+'</span></div>'}).join(''))+
section(labels.cert,certs.slice(0,2).map(function(x){return'<div class="cert"><b>'+esc(t(x.name,l))+'</b><span class="cert-provider">'+esc(t(x.provider,l))+'</span><span class="cert-date">'+esc(t(x.dateLabel,l))+'</span></div>'}).join(''));
var jobs='<div class="timeline">'+roles.map(function(r,i){var max=i<4?2:1;return'<article class="job"><div class="job-head"><p class="job-title">'+esc(t(r.title,l))+'</p><time class="when">'+esc(t(r.period,l))+'</time></div><p class="company">'+esc(r.company)+' · '+esc(t(r.location,l))+'</p><ul>'+bullets(r,l,max).map(function(b){return'<li>'+esc(b)+'</li>'}).join('')+'</ul></article>'}).join('')+'</div>';
var defaultScope=ar?['عمليات التجزئة الوطنية','قيادة القوى الميدانية','أداء المبيعات ومؤشرات KPI','التدريب وتطوير القدرات','إطلاق المنتجات','إدارة أصحاب المصلحة']:['National Retail Operations','Field Force Leadership','Sales Performance & KPIs','Training & Capability','Product Launches','Stakeholder Management'];
var scope=T&&T.scope&&T.scope[l]&&T.scope[l].length?T.scope[l]:defaultScope;
var summary=T&&T.summary&&T.summary[l]?T.summary[l]:t(p.lede,l);
var main=section(labels.about,'<p class="summary">'+esc(summary)+'</p>')+section(labels.scope,'<div class="scope-list">'+scope.slice(0,6).map(function(x){return'<div class="scope-item">'+esc(x)+'</div>'}).join('')+'</div>')+section(labels.exp,jobs);
var qr='';
return'<article class="page'+(ar?' sec-ar':'')+'" dir="'+(ar?'rtl':'ltr')+'">'+top+'<div class="layout"><aside class="side">'+side+'</aside><div class="main">'+main+'</div></div>'+qr+'</article>'}
function draw(){document.getElementById('out').innerHTML=render(L);document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr'}
var q=new URLSearchParams(location.search),requestId=q.get('request')||'',lang=q.get('lang'),local=q.get('local')==='1';if(local)document.documentElement.classList.add('cv-export-a4');if(lang==='ar'||lang==='en')L=lang;
var selection=local?Promise.resolve(window.parent&&window.parent.__AA_TAILORED_RESULT__):fetch('tailor/request.json?v='+encodeURIComponent(requestId),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('tailor/request.json');return r.json()});
Promise.all(FILES.map(function(f){return fetch('data/'+f+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(f);return r.json()})}).concat([selection])).then(function(a){FILES.forEach(function(f,i){D[f]=a[i]});T=a[a.length-1];if(!T||!T.active||!T.requestId||T.requestId!==requestId)throw Error('Tailored request mismatch');draw();document.title='Ahmad Alshehri — '+(T.jobTitle||'Tailored CV');window.__TAILORED_READY__=true}).catch(function(e){window.__TAILORED_ERROR__=e.message;document.getElementById('out').innerHTML='<div class="page"><h1>Could not load tailored CV</h1><p>'+esc(e.message)+'</p></div>';window.__TAILORED_READY__=true});
})();
</script></body></html>
