<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ahmad Alshehri — ATS CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202e;--soft:#46505e;--mute:#737b87;--line:#d9d5cd;--gold:#9f7526;--pale:#f5f2ec;--ok:#4f7b65;--display:'Manrope',sans-serif;--body:'IBM Plex Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#e9e7e2;color:var(--ink);font-family:var(--body);font-size:9.45pt;line-height:1.38}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:10px max(18px,calc((100vw - 210mm)/2));display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:.8rem;box-shadow:0 4px 20px rgba(0,0,0,.18)}
.brand{font-family:var(--display);font-weight:800}.sync{color:rgba(255,255,255,.65)}.sp{margin-inline-start:auto}
.bar button,.bar select,.bar a{font:600 .78rem var(--body);border-radius:4px;padding:7px 12px;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none}.bar .primary{background:var(--gold);border-color:var(--gold)}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:18px auto;padding:12mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.12);position:relative;overflow:hidden}
.sheet::after{content:attr(data-page);position:absolute;bottom:7mm;right:14mm;color:var(--mute);font-size:7.5pt}
.sec-ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;text-align:right}
header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
h1{font:800 22pt/1.05 var(--display);letter-spacing:-.025em;margin:0 0 3px}.role{font:600 9.8pt var(--display);color:var(--gold);margin:0}.contact{text-align:right;color:var(--soft);font-size:8.2pt;line-height:1.55}.sec-ar .contact{text-align:left}
h2{font:700 9.5pt var(--display);letter-spacing:.11em;text-transform:uppercase;margin:13px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}.sec-ar h2{letter-spacing:0}
p{margin:0 0 5px;color:var(--soft)}
.summary{font-size:9.3pt;line-height:1.5}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 10px}.impact-item{background:var(--pale);padding:8px;border-top:2px solid var(--gold)}.impact-item strong{display:block;font:800 14pt var(--display);color:var(--ink)}.impact-item span{font-size:7.7pt;color:var(--soft)}
.job{margin-bottom:9px;break-inside:avoid}.job-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.job-title{font:700 10.2pt var(--display);color:var(--ink);margin:0}.when{font-size:8pt;color:var(--mute);white-space:nowrap}.company{font-size:8.3pt;color:var(--gold);font-weight:600;margin:0 0 3px}
ul{margin:0;padding:0;list-style:none}.job li{position:relative;padding-inline-start:11px;margin:0 0 2.5px;color:var(--soft);font-size:8.55pt}.job li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:4px;height:1px;background:var(--gold)}
.progression{font-size:7.8pt;color:var(--mute);background:var(--pale);padding:5px 7px;margin:-2px 0 7px;border-radius:3px}
.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.skill-list{display:flex;flex-wrap:wrap;gap:5px}.skill{font-size:8.2pt;border:1px solid var(--line);padding:4px 6px;border-radius:3px;color:var(--soft)}
.cert{display:grid;grid-template-columns:1fr auto;gap:8px;padding:4px 0;border-bottom:1px solid #ece9e3;break-inside:avoid}.cert b{font-size:8.35pt}.cert small{display:block;color:var(--mute);font-size:7.6pt}.cert time{font-size:7.7pt;color:var(--gold);white-space:nowrap}
.meta{font-size:8.5pt;color:var(--soft)}.meta strong{color:var(--ink)}
.note{margin-top:8px;padding:7px;background:var(--pale);font-size:7.6pt;color:var(--mute)}
.empty{padding:28px;background:#fff;max-width:210mm;margin:30px auto}
@media(max-width:820px){.sheet{width:auto;min-height:0;margin:12px;padding:22px}.impact{grid-template-columns:1fr;gap:6px}.impact-item{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;padding:7px 9px;border-top:0;border-left:3px solid var(--gold)}.sec-ar .impact-item{border-left:0;border-right:3px solid var(--gold)}.impact-item strong{font-size:13pt}.impact-item span{font-size:7.5pt;line-height:1.35}.cols{grid-template-columns:1fr}header{grid-template-columns:1fr}.contact,.sec-ar .contact{text-align:start}.sync{display:none}}
@media print{body{background:#fff}.bar{display:none}.sheet{width:auto;height:297mm;min-height:297mm;margin:0;padding:11mm 13mm;box-shadow:none;page-break-after:always}.sheet:last-child{page-break-after:auto}.impact{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:7px!important}.impact-item,.sec-ar .impact-item{display:block!important;padding:8px!important;border-left:0!important;border-right:0!important;border-top:2px solid var(--gold)!important}.impact-item strong{display:block!important;font-size:14pt!important;line-height:1.1!important;white-space:nowrap!important;margin-bottom:4px!important}.impact-item span{display:block!important;font-size:7.5pt!important;line-height:1.3!important} @page{size:A4;margin:0}h2{break-after:avoid}.job,.cert{break-inside:avoid}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">Ahmad Alshehri — CV</span>
  <select id="mode" aria-label="CV language"><option value="en">English</option><option value="ar">العربية</option><option value="both">Bilingual</option></select>
  <span class="sp"></span><a href="index.html">← Website</a><a href="admin/">Edit data</a>
  <button class="primary" id="export">Download CV</button>
</div>
<main id="out"></main>
<script>
(function(){
'use strict';
var FILES=['profile','settings','experience','achievements','skills','certifications','education','languages','projects','training'];
var D={},L='en';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(v,lang){lang=lang||L;if(v==null)return'';return typeof v==='string'?v:(v[lang]||v.en||v.ar||'')}
function visible(a){return(a||[]).filter(function(x){return x.visible!==false}).sort(function(a,b){return(a.order||0)-(b.order||0)})}
function textScore(s){s=String(s||'');var score=0;if(/\d|%|SAR|KSA|national|nationwide|regional|مستهدف|المملكة|إقليمي/.test(s))score+=5;if(/achiev|improv|increas|reduc|deliver|lead|manage|own|build|launch|تحقيق|تحسين|قياد|إدارة|إطلاق/.test(s.toLowerCase()))score+=3;if(/result|productiv|performance|sales|commercial|KPI|نتائج|إنتاجية|أداء|مبيعات|تجاري/.test(s))score+=2;score+=Math.max(0,3-Math.floor(s.length/110));return score}
function unique(list){var seen={};return list.filter(function(x){var k=String(x).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');if(!k||seen[k])return false;seen[k]=1;return true})}
function bullets(role,lang,max){var a=[];(role.achievements||[]).forEach(function(x){a.push(t(x,lang))});((role.responsibilities&&role.responsibilities[lang])||[]).forEach(function(x){a.push(x)});return unique(a).sort(function(a,b){return textScore(b)-textScore(a)}).slice(0,max)}
function rankedCerts(){var key=/artificial intelligence|training of trainers|package design|project management|quality|ذكاء اصطناعي|تدريب المدربين|الحقائب|المشاريع|الجودة/i;return visible(D.certifications.items).map(function(x){var y=Number((x.date||'0').slice(0,4));x._score=(key.test(t(x.name,'en'))?4:0)+(y>=2025?6:y>=2021?2:1)+(Number(x.hours)>=30?1:0);return x}).sort(function(a,b){return b._score-a._score||(a.order||0)-(b.order||0)}).slice(0,5)}
function rankedSkills(lang){var preferred=/sales strategy|field force|target planning|KPI|performance management|retail|training needs|training delivery|team leadership|stakeholder|data analysis|competitor|استراتيجية المبيعات|القوى الميدانية|المستهدف|مؤشرات الأداء|التجزئة|الاحتياجات التدريبية|قيادة الفرق|أصحاب المصلحة|تحليل البيانات|المنافسين/i;var items=visible(D.skills.items).sort(function(a,b){return(preferred.test(t(b.name,lang))?2:0)-(preferred.test(t(a.name,lang))?2:0)||(a.order||0)-(b.order||0)});return unique(items.map(function(x){return t(x.name,lang)})).slice(0,12)}
function metrics(lang){var a=visible(D.achievements.items),out=[];a.forEach(function(x){if(out.length>=3)return;var val=x.value||'';if(x.auto==='years')val=new Date().getFullYear()-(Number(D.settings.metrics.experienceStartYear)||2020);if(x.auto==='roles')val=visible(D.experience.items).length;if(x.auto==='certificates')val=visible(D.certifications.items).length;if(x.auto==='hours')val=visible(D.certifications.items).reduce(function(s,c){return s+(Number(c.hours)||0)},0);if(val!==''&&val!=null)out.push({v:String(val)+(t(x.unit,lang)||''),label:t(x.title,lang)})});return out.slice(0,3)}
function header(lang){var p=D.profile,c=p.contact;return'<header><div><h1>'+esc(t(p.name,lang))+'</h1><p class="role">'+esc(t(p.headline,lang))+'</p></div><div class="contact">'+[t(c.location,lang),c.phone,c.email,c.linkedin].filter(Boolean).map(esc).join('<br>')+'</div></header>'}
function job(r,lang,max){var b=bullets(r,lang,max);return'<article class="job"><div class="job-head"><p class="job-title">'+esc(t(r.title,lang))+'</p><span class="when">'+esc(t(r.period,lang))+'</span></div><p class="company">'+esc(r.company)+' — '+esc(t(r.location,lang))+'</p><ul>'+b.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul></article>'}
function renderLang(lang){L=lang;var ar=lang==='ar',roles=visible(D.experience.items),p=D.profile,ms=metrics(lang),certs=rankedCerts(),skills=rankedSkills(lang);var summary=t(p.lede,lang)||((p.summary&&p.summary[lang])||[])[0]||'';var labels=ar?{sum:'الملخص المهني',impact:'أبرز النتائج',exp:'الخبرات المهنية',skills:'الكفاءات الأساسية',cert:'الشهادات والتدريب',edu:'التعليم',lang:'اللغات',prog:'المسار الوظيفي في HONOR: مستشار علامة ← مدرب إقليمي ← مدير منطقة ← مدير إدارة القوى الميدانية'}:{sum:'Professional Summary',impact:'Career Highlights',exp:'Professional Experience',skills:'Core Competencies',cert:'Certifications & Training',edu:'Education',lang:'Languages',prog:'Career progression at HONOR: Brand Consultant → Regional Trainer → Area Manager → Field Force Management Manager'};
var cls=ar?' sec-ar':'';var h1='<section class="sheet'+cls+'" dir="'+(ar?'rtl':'ltr')+'" data-page="1 / 2">'+header(lang)+'<h2>'+labels.sum+'</h2><p class="summary">'+esc(summary)+'</p><h2>'+labels.impact+'</h2><div class="impact">'+ms.map(function(m){return'<div class="impact-item"><strong>'+esc(m.v)+'</strong><span>'+esc(m.label)+'</span></div>'}).join('')+'</div><h2>'+labels.exp+'</h2>';
roles.slice(0,3).forEach(function(r,i){h1+=job(r,lang,i===0?4:3)});h1+='</section>';
var h2='<section class="sheet'+cls+'" dir="'+(ar?'rtl':'ltr')+'" data-page="2 / 2">'+header(lang)+'<h2>'+labels.exp+'</h2><div class="progression">'+labels.prog+'</div>';roles.slice(3).forEach(function(r){h2+=job(r,lang,2)});h2+='<div class="cols"><div><h2>'+labels.skills+'</h2><div class="skill-list">'+skills.map(function(s){return'<span class="skill">'+esc(s)+'</span>'}).join('')+'</div><h2>'+labels.edu+'</h2>'+visible(D.education.items).map(function(e){return'<p class="meta"><strong>'+esc(t(e.program,lang))+'</strong> — '+esc(t(e.institution,lang))+' · '+esc(t(e.status,lang))+'</p>'}).join('')+'<h2>'+labels.lang+'</h2><p class="meta">'+visible(D.languages.items).map(function(x){return'<strong>'+esc(t(x.name,lang))+'</strong> — '+esc(t(x.level,lang))}).join(' · ')+'</p></div><div><h2>'+labels.cert+'</h2>'+certs.map(function(c){return'<div class="cert"><span><b>'+esc(t(c.name,lang))+'</b><small>'+esc(t(c.provider,lang))+'</small></span><time>'+esc(t(c.dateLabel,lang))+'</time></div>'}).join('')+'</div></div></section>';return h1+h2}
function render(){var mode=document.getElementById('mode').value;document.getElementById('out').innerHTML=mode==='both'?renderLang('en')+renderLang('ar'):renderLang(mode);document.documentElement.lang=mode==='ar'?'ar':'en';document.title='Ahmad Alshehri — CV'}
Promise.all(FILES.map(function(f){return fetch('data/'+f+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(f);return r.json()})})).then(function(all){FILES.forEach(function(f,i){D[f]=all[i]});var q=new URLSearchParams(location.search).get('lang');if(q&&/^(en|ar|both)$/.test(q))document.getElementById('mode').value=q;render();document.getElementById('mode').onchange=render;document.getElementById('export').onclick=function(){var mode=document.getElementById('mode').value;document.title='Ahmad-Alshehri-CV-'+mode+'-'+new Date().toISOString().slice(0,10);window.print()}}).catch(function(e){document.getElementById('out').innerHTML='<div class="empty"><h1>Could not load CV data</h1><p>'+esc(e.message)+'</p></div>'})
})();
</script>
</body>
</html>
