<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ahmad Alshehri — CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202E;--soft:#4A5261;--mute:#7C828E;--line:#DDD9D2;--gold:#9F7526;
  --display:'Manrope',sans-serif;--body:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#EDEBE7;color:var(--ink);font-family:var(--body);font-size:10.5pt;line-height:1.5}
.bar{
  position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;
  padding:11px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;
}
.bar b{font-family:var(--display);font-weight:700}
.bar .sp{margin-inline-start:auto}
.bar button,.bar select,.bar a{
  font-family:var(--body);font-size:.82rem;font-weight:600;border-radius:3px;padding:7px 14px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;
}
.bar button.p{background:var(--gold);border-color:var(--gold)}
.sync-note{font-size:.76rem;color:rgba(255,255,255,.68)}
.bar select{background:#1D2837}
.page{
  background:#fff;max-width:210mm;margin:20px auto;padding:16mm 15mm;
  box-shadow:0 4px 24px rgba(0,0,0,.12);
}
.sec-ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;text-align:right}
h1{font-family:var(--display);font-weight:800;font-size:23pt;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
.role-line{font-family:var(--display);font-weight:600;font-size:11pt;color:var(--gold);margin:0 0 8px}
.contact-line{font-size:9pt;color:var(--soft);margin:0 0 4px}
.rule{height:2px;background:var(--ink);margin:14px 0 16px}
h2{
  font-family:var(--display);font-weight:700;font-size:10pt;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);margin:20px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);
}
.sec-ar h2{letter-spacing:normal}
p{margin:0 0 7px;color:var(--soft)}
.job{margin-bottom:13px;break-inside:avoid}
.job-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.job-title{font-family:var(--display);font-weight:700;font-size:11pt;margin:0}
.job-when{font-size:9pt;color:var(--mute);white-space:nowrap}
.job-co{font-size:9.5pt;color:var(--gold);font-weight:600;margin:1px 0 5px}
ul{margin:0;padding:0;list-style:none}
.job li,.blk li{position:relative;padding-inline-start:13px;margin-bottom:3px;color:var(--soft);font-size:9.5pt}
.job li::before,.blk li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:5px;height:1px;background:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.skl{margin-bottom:8px}
.skl b{font-family:var(--display);font-size:9.5pt;display:block;margin-bottom:2px}
.skl span{font-size:9pt;color:var(--soft)}
.crt{display:flex;justify-content:space-between;gap:14px;padding:3.5px 0;font-size:9.5pt;break-inside:avoid}
.crt .nm{color:var(--ink)}
.crt .nm small{color:var(--mute);display:block;font-size:8.5pt}
.crt .hr{color:var(--gold);font-weight:600;white-space:nowrap}
.meta-row{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:9pt;color:var(--soft)}
.divider{margin:26px 0;border-top:2px dashed var(--line)}
@media print{
  body{background:#fff}
  .bar{display:none}
  .page{box-shadow:none;margin:0;max-width:none;padding:12mm 13mm}
  @page{size:A4;margin:0}
  .job,.crt{break-inside:avoid}
  h2{break-after:avoid}
}
</style>
</head>
<body>

<div class="bar">
  <b>CV</b>
  <span class="sync-note">Live ATS version · synced with website data</span>
  <select id="mode">
    <option value="en">English</option>
    <option value="ar">العربية</option>
    <option value="both">Bilingual</option>
  </select>
  <span class="sp"></span>
  <a href="index.html">← Back to site</a>
  <button class="p" id="print">Export ATS PDF</button>
</div>

<div id="out"></div>

<script>
(function () {
  'use strict';
  var FILES = ['profile','settings','experience','achievements','skills',
    'certifications','education','languages','projects','training'];
  var D = {}, L = 'en';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function t(v){ if(v==null)return''; return typeof v==='string'?v:(v[L]||v.en||v.ar||''); }
  function vis(a){return (a||[]).filter(function(x){return x.visible!==false;})
    .sort(function(x,y){return (x.order||0)-(y.order||0);});}

  var TXT = {
    summary:{en:'Professional Summary',ar:'الملخص المهني'},
    exp:{en:'Professional Experience',ar:'الخبرات المهنية'},
    proj:{en:'Selected Projects',ar:'مشاريع مختارة'},
    skills:{en:'Core Competencies',ar:'الكفاءات الأساسية'},
    certs:{en:'Certifications & Training',ar:'الشهادات والتدريب'},
    edu:{en:'Education',ar:'التعليم'},
    lang:{en:'Languages',ar:'اللغات'},
    hours:{en:'hrs',ar:'ساعة'},
    total:{en:'total training hours',ar:'إجمالي ساعات التدريب'}
  };

  function page(lang){
    L = lang;
    var p = D.profile, c = p.contact;
    var certs = vis(D.certifications.items);
    var hours = certs.reduce(function(s,x){return s+(Number(x.hours)||0);},0);

    var h = '<div class="page' + (lang==='ar'?' sec-ar':'') + '" dir="' + (lang==='ar'?'rtl':'ltr') + '">';
    h += '<h1>' + esc(t(p.name)) + '</h1>';
    h += '<p class="role-line">' + esc(t(p.headline)) + '</p>';
    h += '<p class="contact-line">' + [esc(t(c.location)), esc(c.phone), esc(c.email), c.linkedin?esc(c.linkedin):''].filter(Boolean).join('  ·  ') + '</p>';
    h += '<div class="rule"></div>';

    h += '<h2>' + esc(t(TXT.summary)) + '</h2>';
    (p.summary[lang]||p.summary.en||[]).forEach(function(x){ h += '<p>' + esc(x) + '</p>'; });

    h += '<h2>' + esc(t(TXT.exp)) + '</h2>';
    vis(D.experience.items).forEach(function(r){
      h += '<div class="job"><div class="job-head"><p class="job-title">' + esc(t(r.title)) + '</p>' +
        '<span class="job-when">' + esc(t(r.period)) + '</span></div>' +
        '<p class="job-co">' + esc(r.company) + ' — ' + esc(t(r.location)) + '</p><ul>' +
        ((r.responsibilities&&r.responsibilities[lang])||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('') +
        '</ul></div>';
    });

    var projects = vis(D.projects.items);
    if (projects.length) {
      h += '<h2>' + esc(t(TXT.proj)) + '</h2>';
      projects.forEach(function(pr){
        h += '<div class="job"><div class="job-head"><p class="job-title">' + esc(t(pr.title)) + '</p>' +
          '<span class="job-when">' + esc(pr.year||'') + '</span></div>' +
          '<p class="job-co">' + esc(pr.company||'') + '</p>' +
          (t(pr.result)?'<p>'+esc(t(pr.result))+'</p>':'') +
          ((pr.kpis||[]).length?'<div class="meta-row">'+pr.kpis.map(function(k){return esc(t(k));}).join(' · ')+'</div>':'') +
          '</div>';
      });
    }

    h += '<h2>' + esc(t(TXT.skills)) + '</h2><div class="two">';
    var groups = {}, order = [];
    vis(D.skills.items).forEach(function(s){
      var k = s.categoryKey || t(s.category);
      if(!groups[k]){groups[k]={cat:s.category,list:[]};order.push(k);}
      groups[k].list.push(t(s.name));
    });
    order.forEach(function(k){
      h += '<div class="skl"><b>' + esc(t(groups[k].cat)) + '</b><span>' +
        esc(groups[k].list.filter(Boolean).join(' · ')) + '</span></div>';
    });
    h += '</div>';

    h += '<h2>' + esc(t(TXT.certs)) + ' — ' + hours + ' ' + esc(t(TXT.total)) + '</h2>';
    certs.forEach(function(x){
      h += '<div class="crt"><span class="nm">' + esc(t(x.name)) +
        '<small>' + esc(t(x.provider)) + '</small></span>' +
        '<span class="hr">' + esc(x.hours) + ' ' + esc(t(TXT.hours)) + ' · ' + esc(t(x.dateLabel)) + '</span></div>';
    });

    h += '<h2>' + esc(t(TXT.edu)) + '</h2>';
    vis(D.education.items).forEach(function(e){
      h += '<div class="job"><div class="job-head"><p class="job-title">' + esc(t(e.program)) + '</p>' +
        '<span class="job-when">' + esc(t(e.status)) + '</span></div>' +
        '<p class="job-co">' + esc(t(e.institution)) + '</p></div>';
    });

    h += '<h2>' + esc(t(TXT.lang)) + '</h2><div class="meta-row">' +
      vis(D.languages.items).map(function(l){ return esc(t(l.name)) + ' — ' + esc(t(l.level)); }).join('  ·  ') +
      '</div>';

    return h + '</div>';
  }

  function render(){
    var m = document.getElementById('mode').value;
    document.getElementById('out').innerHTML =
      m === 'both' ? page('en') + page('ar') : page(m);
    document.documentElement.setAttribute('lang', m === 'ar' ? 'ar' : 'en');
    document.title = 'Ahmad Alshehri — CV';
  }

  Promise.all(FILES.map(function(f){
    return fetch('data/'+f+'.json',{cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error(f); return r.json(); });
  })).then(function(all){
    FILES.forEach(function(f,i){ D[f]=all[i]; });
    var q = new URLSearchParams(location.search).get('lang');
    if (q) document.getElementById('mode').value = q;
    render();
    document.getElementById('mode').onchange = render;
    document.getElementById('print').onclick = function(){
      document.title = 'Ahmad-Alshehri-ATS-CV-' + document.getElementById('mode').value;
      window.print();
    };
  }).catch(function(e){
    document.getElementById('out').innerHTML =
      '<div class="page"><h1>Could not load CV data</h1><p>' + esc(e.message) + '</p></div>';
  });
})();
</script>
</body>
</html>
