<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Ahmad Alshehri — One Page CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171b22;--text:#4e535b;--muted:#777c84;--line:#b9bcc1;--soft:#eef0f2;--accent:#ad7d2e;--display:'Manrope',sans-serif;--body:'IBM Plex Sans',sans-serif}
*{box-sizing:border-box}body{margin:0;background:#292d33;color:var(--ink);font-family:var(--body);font-size:8.15pt;line-height:1.32}
.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(16px,calc((100vw - 210mm)/2));background:#171b22;color:white;box-shadow:0 5px 18px #0004}
.toolbar b{font:700 12px var(--display)}.toolbar small{opacity:.55}.toolbar .push{margin-inline-start:auto}.toolbar a,.toolbar button,.toolbar select{border:1px solid #ffffff38;background:transparent;color:#fff;border-radius:5px;padding:7px 11px;font:600 11px var(--body);text-decoration:none;cursor:pointer}.toolbar button{background:var(--accent);border-color:var(--accent)}
.page{width:210mm;height:297mm;margin:16px auto;background:#fff;box-shadow:0 8px 35px #0005;overflow:hidden;padding:10.5mm 11mm 9mm}
.top{display:grid;grid-template-columns:28mm 1fr 52mm;gap:8mm;align-items:center;margin-bottom:6mm}.photo{width:28mm;height:28mm;border-radius:50%;object-fit:cover;object-position:center 20%;filter:grayscale(100%);border:1px solid #ddd}.name h1{margin:0;font:500 24pt/1 var(--display);letter-spacing:.05em;text-transform:uppercase}.name h1 strong{display:block;font-weight:800}.name p{margin:5px 0 0;color:var(--muted);font:600 7.6pt var(--display);letter-spacing:.15em;text-transform:uppercase}.contact{font-size:7.6pt;color:var(--text);line-height:1.65}.contact div{display:flex;gap:6px;align-items:flex-start}.ico{color:var(--ink);font-weight:700;width:11px;flex:none}
.layout{display:grid;grid-template-columns:54mm 1fr;gap:10mm}.side{padding-top:1mm}.main{min-width:0}.section{margin-bottom:5mm}.section:last-child{margin-bottom:0}
h2{font:700 10pt var(--display);letter-spacing:.19em;text-transform:uppercase;margin:0 0 3mm;padding-bottom:1.6mm;border-bottom:1px solid var(--line)}p{margin:0;color:var(--text)}
.summary{font-size:8.15pt;line-height:1.43;border-inline-start:1px solid var(--ink);padding-inline-start:4mm}
.metric{display:grid;grid-template-columns:18mm minmax(0,1fr);gap:3mm;padding:1.8mm 0;border-bottom:1px solid #e3e4e6;align-items:start}.metric strong{display:block;min-width:0;font:800 11pt/1 var(--display)}.metric strong em{display:block;font-style:normal;white-space:nowrap}.metric strong small{display:block;margin-top:1mm;font:700 5.3pt/1.1 var(--display);letter-spacing:.055em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}.metric>span{min-width:0;font-size:7pt;color:var(--muted);line-height:1.25}
.timeline{position:relative;padding-inline-start:5mm}.timeline:before{content:"";position:absolute;inset-inline-start:1mm;top:2mm;bottom:1mm;width:1px;background:#8d9197}.job{position:relative;margin-bottom:3.1mm;break-inside:avoid}.job:before{content:"";position:absolute;inset-inline-start:-4.7mm;top:1.2mm;width:2.1mm;height:2.1mm;background:#fff;border:1.2px solid var(--ink);border-radius:50%}.job-head{display:flex;justify-content:space-between;gap:4mm;align-items:baseline}.job-title{font:700 8.5pt var(--display);letter-spacing:.045em;text-transform:uppercase;color:var(--ink)}.when{white-space:nowrap;font:600 6.8pt var(--display);letter-spacing:.08em;color:var(--muted)}.company{font:600 7.2pt var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin:.7mm 0}.job ul{list-style:none;padding:0;margin:0}.job li{position:relative;padding-inline-start:2.6mm;margin:.55mm 0;color:var(--text);font-size:7.25pt;line-height:1.28}.job li:before{content:"•";position:absolute;inset-inline-start:0;color:var(--ink)}
.list{list-style:none;margin:0;padding:0}.list li{padding:1mm 0;color:var(--text);font-size:7.45pt}.lang{margin-bottom:2.4mm}.lang b{display:block;font:600 7.6pt var(--display)}.track{height:1px;background:#c9ccd0;margin-top:1.2mm}.track i{display:block;height:2px;background:var(--ink);margin-top:-1px}
.edu b,.cert b{display:block;font:700 7.6pt var(--display);color:var(--ink)}.edu span,.cert span{color:var(--muted);font-size:6.9pt}.cert{margin-bottom:2mm}.skills{columns:2;column-gap:5mm}.skills li{break-inside:avoid;border-bottom:1px solid #d7d9dc;padding:1.05mm 0;font-size:7.1pt}
.note{font-size:6.6pt;color:#8a8e94;margin-top:2mm}.sec-ar{direction:rtl;text-align:right;font-family:'IBM Plex Sans Arabic',sans-serif}.sec-ar *{letter-spacing:0!important}.sec-ar .contact div{flex-direction:row}.sec-ar .name h1{text-transform:none}.sec-ar .name p{text-transform:none}
@media(max-width:820px){.page{width:auto;height:auto;min-height:0;margin:10px;padding:22px}.top{grid-template-columns:65px 1fr}.photo{width:65px;height:65px}.contact{grid-column:1/-1}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:20px}.side .section{margin:0}.toolbar small{display:none}}
@media print{body{background:#fff}.toolbar{display:none}.page{width:210mm;height:297mm;margin:0;box-shadow:none;page-break-after:avoid}@page{size:A4;margin:0}}
</style></head>
<body><div class="toolbar"><b>Ahmad Alshehri — One-page CV</b><small>Live from your portfolio data</small><span class="push"></span><select id="mode"><option value="en">English</option><option value="ar">العربية</option></select><a href="index.html">Website</a><a href="admin/">Edit data</a><button id="print">Export PDF</button></div><main id="out"></main>
<script>
(function(){'use strict';
var FILES=['profile','settings','experience','achievements','skills','certifications','education','languages'],D={},L='en';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(v,l){l=l||L;return v==null?'':typeof v==='string'?v:(v[l]||v.en||v.ar||'')}
function vis(a){return(a||[]).filter(function(x){return x.visible!==false}).sort(function(a,b){return(a.order||0)-(b.order||0)})}
function uniq(a){var s={};return a.filter(function(x){var k=x.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');if(!k||s[k])return false;s[k]=1;return true})}
function score(s){var n=0;s=String(s||'');if(/\d|%|KSA|national|regional|المملكة|إقليمي/.test(s))n+=5;if(/achiev|lead|manage|deliver|build|launch|تحقيق|قياد|إدار|إطلاق/i.test(s))n+=3;return n-Math.floor(s.length/170)}
function bullets(r,l,max){var a=[];(r.achievements||[]).forEach(function(x){a.push(t(x,l))});(((r.responsibilities||{})[l])||[]).forEach(function(x){a.push(x)});return uniq(a).sort(function(a,b){return score(b)-score(a)}).slice(0,max)}
function metrics(l){var out=[];vis(D.achievements.items).forEach(function(x){if(out.length>=3)return;var v=x.value||'';if(x.auto==='years')v=new Date().getFullYear()-(+D.settings.metrics.experienceStartYear||2020);if(x.auto==='trainingHours')v=vis(D.certifications.items).reduce(function(s,c){return s+(+c.hours||0)},0);out.push({v:String(v),unit:t(x.unit,l),label:t(x.title,l)})});return out}
function section(title,body,cl){return'<section class="section '+(cl||'')+'"><h2>'+title+'</h2>'+body+'</section>'}
function render(l){L=l;var ar=l==='ar',p=D.profile,c=p.contact,roles=vis(D.experience.items),labels=ar?{about:'نبذة مهنية',impact:'أبرز النتائج',exp:'الخبرات العملية',skills:'المهارات',edu:'التعليم',cert:'شهادات مختارة',langs:'اللغات'}:{about:'About Me',impact:'Career Highlights',exp:'Work Experience',skills:'Skills',edu:'Education',cert:'Selected Training',langs:'Languages'};
var contact=[['●',t(c.location,l)],['☎',c.phone],['✉',c.email],['↗',c.linkedin]].filter(function(x){return x[1]}).map(function(x){return'<div><span class="ico">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>'}).join('');
var top='<header class="top"><img class="photo" src="'+esc(p.photo||'')+'" alt=""><div class="name"><h1>'+esc(t(p.name,l)).replace(' ',' <strong>')+'</strong><p>'+esc(t(p.headline,l))+'</p></div><div class="contact">'+contact+'</div></header>';
var side=section(labels.impact,metrics(l).map(function(m){var symbol=/^[+%٪]$/.test(String(m.unit).trim());return'<div class="metric"><strong><em>'+esc(m.v)+(symbol?esc(m.unit):'')+'</em>'+(!symbol&&m.unit?'<small>'+esc(m.unit)+'</small>':'')+'</strong><span>'+esc(m.label)+'</span></div>'}).join(''))+
section(labels.skills,'<ul class="list skills">'+uniq(vis(D.skills.items).map(function(x){return t(x.name,l)})).slice(0,10).map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul>')+
section(labels.langs,vis(D.languages.items).map(function(x,i){return'<div class="lang"><b>'+esc(t(x.name,l))+'</b><span>'+esc(t(x.level,l))+'</span><div class="track"><i style="width:'+(i?78:100)+'%"></i></div></div>'}).join(''))+
section(labels.edu,vis(D.education.items).map(function(x){return'<div class="edu"><b>'+esc(t(x.program,l))+'</b><span>'+esc(t(x.institution,l))+'<br>'+esc(t(x.status,l))+'</span></div>'}).join(''))+
section(labels.cert,vis(D.certifications.items).sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,4).map(function(x){return'<div class="cert"><b>'+esc(t(x.name,l))+'</b><span>'+esc(t(x.provider,l))+' · '+esc(t(x.dateLabel,l))+'</span></div>'}).join(''));
var jobs='<div class="timeline">'+roles.map(function(r,i){var max=i<2?2:1;return'<article class="job"><div class="job-head"><p class="job-title">'+esc(t(r.title,l))+'</p><time class="when">'+esc(t(r.period,l))+'</time></div><p class="company">'+esc(r.company)+' · '+esc(t(r.location,l))+'</p><ul>'+bullets(r,l,max).map(function(b){return'<li>'+esc(b)+'</li>'}).join('')+'</ul></article>'}).join('')+'</div>';
var main=section(labels.about,'<p class="summary">'+esc(t(p.lede,l))+'</p>')+section(labels.exp,jobs);
return'<article class="page'+(ar?' sec-ar':'')+'" dir="'+(ar?'rtl':'ltr')+'">'+top+'<div class="layout"><aside class="side">'+side+'</aside><div class="main">'+main+'</div></div></article>'}
function draw(){var l=document.getElementById('mode').value;document.getElementById('out').innerHTML=render(l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr'}
Promise.all(FILES.map(function(f){return fetch('data/'+f+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(f);return r.json()})})).then(function(a){FILES.forEach(function(f,i){D[f]=a[i]});var q=new URLSearchParams(location.search).get('lang');if(q==='ar'||q==='en')document.getElementById('mode').value=q;draw();document.getElementById('mode').onchange=draw;document.getElementById('print').onclick=function(){document.title='Ahmad-Alshehri-CV-'+document.getElementById('mode').value+'-'+new Date().toISOString().slice(0,10);window.print()}}).catch(function(e){document.getElementById('out').innerHTML='<div class="page"><h1>Could not load CV data</h1><p>'+esc(e.message)+'</p></div>'});
})();
</script></body></html>
