<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Ahmad Alshehri — CV Template Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10273d;--gold:#b8893d;--ink:#263443;--muted:#64717d;--line:#d9dee2;--wash:#f4f6f7;--body:'IBM Plex Sans',sans-serif;--display:'Manrope',sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:#29323a;color:var(--ink);font-family:var(--body);font-size:8pt;line-height:1.36}
.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px max(16px,calc((100vw - 210mm)/2));background:#0b1e30;color:#fff;box-shadow:0 5px 18px #0004;direction:ltr}.toolbar b{font:700 12px var(--display)}.toolbar small{opacity:.58}.toolbar .push{margin-left:auto}.toolbar a,.toolbar select{border:1px solid #ffffff38;background:transparent;color:#fff;border-radius:5px;padding:7px 11px;font:600 11px var(--body);text-decoration:none;cursor:pointer}.toolbar .tag{color:#f0ca84;border-color:#b8893d66}
.page{width:210mm;height:297mm;margin:16px auto;background:#fff;box-shadow:0 8px 35px #0005;overflow:hidden;padding:10mm 11mm 8mm;position:relative}
.head{display:grid;grid-template-columns:minmax(0,1fr) 61mm;gap:9mm;align-items:end;padding-bottom:5mm;border-bottom:2px solid var(--navy);margin-bottom:5mm}.identity h1{margin:0;color:var(--navy);font:800 23pt/1.05 var(--display)}.identity p{margin:2mm 0 0;color:var(--gold);font:700 8.2pt/1.45 var(--display)}.contact{display:grid;gap:1.2mm;color:var(--muted);font-size:7.1pt}.contact div{display:grid;grid-template-columns:13mm minmax(0,1fr);gap:2mm}.contact b{color:var(--navy);font-size:6.2pt;letter-spacing:.04em}.contact span{overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 55mm;gap:8mm;align-items:start}.main,.side{min-width:0}.side{border-inline-start:1px solid var(--line);padding-inline-start:5mm}.section{margin-bottom:4mm}.section:last-child{margin-bottom:0}h2{margin:0 0 2.1mm;padding-bottom:1.15mm;border-bottom:1px solid var(--line);color:var(--navy);font:800 8.8pt var(--display);letter-spacing:.07em;text-transform:uppercase}h2:after{content:"";display:block;width:12mm;height:1.6px;background:var(--gold);position:relative;top:1.45mm}p{margin:0;color:var(--muted)}.summary{font-size:7.85pt;line-height:1.48}
.scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3mm}.chip{background:var(--wash);border-inline-start:1.5px solid var(--gold);padding:1.3mm 1.6mm;color:var(--ink);font:600 6.75pt/1.25 var(--body)}
.metrics{display:grid;gap:1.5mm}.metric{display:grid;grid-template-columns:16mm 1fr;gap:2mm;align-items:center;padding:2mm;background:#f8f5ef;border-inline-start:2px solid var(--gold)}.metric strong{color:var(--navy);font:800 12pt/1 var(--display)}.metric span{color:var(--muted);font-size:6.55pt;line-height:1.25}
.timeline{position:relative;padding-inline-start:4mm}.timeline:before{content:"";position:absolute;inset-inline-start:.7mm;top:1.5mm;bottom:1mm;width:1px;background:#c9b58e}.job{position:relative;margin-bottom:2.45mm}.job:before{content:"";position:absolute;inset-inline-start:-3.8mm;top:1.3mm;width:1.8mm;height:1.8mm;border-radius:50%;background:#fff;border:1.2px solid var(--gold)}.job-head{display:flex;justify-content:space-between;gap:3mm;align-items:baseline}.job-title{color:var(--navy);font:700 7.8pt var(--display)}.when{white-space:nowrap;color:var(--gold);font:600 6.3pt var(--display)}.company{margin:.35mm 0;color:var(--muted);font:600 6.4pt var(--display)}.job ul{list-style:none;padding:0;margin:0}.job li{position:relative;padding-inline-start:2.2mm;margin:.35mm 0;color:var(--muted);font-size:6.65pt;line-height:1.28}.job li:before{content:'•';position:absolute;inset-inline-start:0;color:var(--gold)}
.group{margin-bottom:2.4mm}.group b{display:block;margin-bottom:.7mm;color:var(--gold);font:700 6.3pt var(--display)}.list{list-style:none;padding:0;margin:0}.list li{padding:.75mm 0;border-bottom:1px solid #edf0f2;color:var(--muted);font-size:6.75pt}.lang,.edu{margin-bottom:2mm}.lang b,.edu b,.cert b{display:block;color:var(--navy);font-size:6.9pt}.lang span,.edu span,.cert span{color:var(--muted);font-size:6.35pt}.bar{height:1px;background:#d6dce0;margin-top:1mm}.bar i{display:block;height:2px;background:var(--gold);margin-top:-1px}.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4mm 4mm}.cert{border-inline-start:1.5px solid var(--gold);padding-inline-start:1.7mm}.cert span{display:block}.cert em{color:var(--gold);font-style:normal;font-size:6pt}
.sec-ar{font-family:'IBM Plex Sans Arabic',sans-serif}.sec-ar *{letter-spacing:0!important}.sec-ar .identity h1{font-family:'IBM Plex Sans Arabic',sans-serif}.sec-ar .identity p{font-family:'IBM Plex Sans Arabic',sans-serif}
@media(max-width:820px){.page{width:auto;height:auto;min-height:297mm;margin:10px;padding:22px}.head,.grid{grid-template-columns:1fr}.side{border:0;border-top:1px solid var(--line);padding:5mm 0 0}.toolbar small{display:none}}
@media print{html,body{background:#fff}.toolbar{display:none}.page{width:210mm!important;height:297mm!important;margin:0!important;padding:10mm 11mm 8mm!important;box-shadow:none!important;overflow:hidden!important}@page{size:A4;margin:0}}
</style></head>
<body>
<div class="toolbar"><b>CV Template Preview</b><small>Independent preview — current export unchanged</small><span class="push"></span><span class="tag">Preview</span><select id="mode"><option value="ar">العربية</option><option value="en">English</option></select><a href="cv.html">Current CV</a></div><main id="out"></main>
<script>
(function(){'use strict';
var FILES=['profile','settings','experience','achievements','skills','certifications','education','languages'],D={},L='ar';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(v,l){l=l||L;return v==null?'':typeof v==='string'?v:(v[l]||v.en||v.ar||'')}
function vis(a){return(a||[]).filter(function(x){return x.visible!==false}).sort(function(a,b){return(a.order||0)-(b.order||0)})}
function uniq(a){var s={};return a.filter(function(x){var k=x.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');if(!k||s[k])return false;s[k]=1;return true})}
function score(s){var n=0;s=String(s||'');if(/\d|%|KSA|regional|المملكة|إقليمي/.test(s))n+=5;if(/achiev|lead|manage|deliver|build|launch|تحقيق|قياد|إدار|إطلاق/i.test(s))n+=3;return n-Math.floor(s.length/170)}
function bullets(r,l,max){var a=[];(r.achievements||[]).forEach(function(x){a.push(t(x,l))});(((r.responsibilities||{})[l])||[]).forEach(function(x){a.push(x)});return uniq(a).sort(function(a,b){return score(b)-score(a)}).slice(0,max)}
function metrics(l){var out=[];vis(D.achievements.items).forEach(function(x){if(out.length>=3)return;var v=x.value||'';if(x.auto==='years')v=new Date().getFullYear()-(+D.settings.metrics.experienceStartYear||2020);if(x.auto==='trainingHours')v=vis(D.certifications.items).reduce(function(s,c){return s+(+c.hours||0)},0);out.push({v:String(v),unit:t(x.unit,l),label:t(x.title,l)});});return out}
function section(title,body,cl){return'<section class="section '+(cl||'')+'"><h2>'+esc(title)+'</h2>'+body+'</section>'}
function render(l){L=l;var ar=l==='ar',p=D.profile,c=p.contact,roles=vis(D.experience.items);var labels=ar?{about:'نبذة مهنية',scope:'نطاق الخبرة',impact:'أبرز المحطات المهنية',exp:'الخبرة العملية',skills:'المهارات',edu:'التعليم',cert:'دورات وشهادات مختارة',langs:'اللغات',commercial:'التجارية والعمليات',leadership:'التدريب والقيادة'}:{about:'Professional Profile',scope:'Core Expertise',impact:'Career Highlights',exp:'Professional Experience',skills:'Skills',edu:'Education',cert:'Selected Courses & Certifications',langs:'Languages',commercial:'Commercial & Operations',leadership:'Training & Leadership'};
var contact=[[ar?'الموقع':'LOCATION',t(c.location,l)],[ar?'الهاتف':'PHONE',c.phone],[ar?'البريد':'EMAIL',c.email],[ar?'لينكدإن':'LINKEDIN',c.linkedin]].filter(function(x){return x[1]}).map(function(x){return'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'}).join('');
var headline=ar?'إدارة عمليات المبيعات وفرق العمل الميدانية<br>التدريب وتطوير القدرات':'Sales Operations & Field Force Management<br>Training & Capability Development';
var head='<header class="head"><div class="identity"><h1>'+esc(t(p.name,l))+'</h1><p>'+headline+'</p></div><div class="contact">'+contact+'</div></header>';
var metricLabels=ar?['سنوات خبرة مهنية','متوسط تحقيق المستهدف في 2024','ترقيات مهنية داخل HONOR']:['Years of Professional Experience','Average Target Achievement in 2024','Career Promotions at HONOR'];
var all=vis(D.skills.items),commercial=all.filter(function(x){return /cat-[12]/.test(x.categoryKey||'')}).slice(0,5),leadership=all.filter(function(x){return /cat-[34]/.test(x.categoryKey||'')}).slice(0,5);
function group(title,items){return'<div class="group"><b>'+esc(title)+'</b><ul class="list">'+items.map(function(x){return'<li>'+esc(t(x.name,l))+'</li>'}).join('')+'</ul></div>'}
var side=section(labels.impact,'<div class="metrics">'+metrics(l).map(function(m,i){var u=String(m.unit||''),symbol=/^[+%٪]$/.test(u.trim());return'<div class="metric"><strong>'+esc(m.v)+(symbol?esc(u):'')+'</strong><span>'+esc(metricLabels[i]||m.label)+(u&&!symbol?' · '+esc(u):'')+'</span></div>'}).join('')+'</div>')+section(labels.skills,group(labels.commercial,commercial)+group(labels.leadership,leadership))+section(labels.langs,vis(D.languages.items).map(function(x,i){return'<div class="lang"><b>'+esc(t(x.name,l))+'</b><span>'+esc(t(x.level,l))+'</span><div class="bar"><i style="width:'+(i?78:100)+'%"></i></div></div>'}).join(''))+section(labels.edu,vis(D.education.items).map(function(x){return'<div class="edu"><b>'+esc(t(x.program,l))+'</b><span>'+esc(t(x.institution,l))+'<br>'+esc(t(x.status,l))+'</span></div>'}).join(''));
var jobs='<div class="timeline">'+roles.map(function(r,i){return'<article class="job"><div class="job-head"><p class="job-title">'+esc(t(r.title,l))+'</p><time class="when">'+esc(t(r.period,l))+'</time></div><p class="company">'+esc(r.company)+' · '+esc(t(r.location,l))+'</p><ul>'+bullets(r,l,i<4?2:1).map(function(b){return'<li>'+esc(b)+'</li>'}).join('')+'</ul></article>'}).join('')+'</div>';
var scope=ar?['عمليات التجزئة على مستوى المملكة العربية السعودية','قيادة القوى الميدانية','أداء المبيعات ومؤشرات KPI','التدريب وتطوير القدرات','إطلاق المنتجات','إدارة أصحاب المصلحة']:['Saudi Arabia Retail Operations','Field Force Leadership','Sales Performance & KPIs','Training & Capability','Product Launches','Stakeholder Management'];
var certs=vis(D.certifications.items).sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,6).map(function(x){return'<div class="cert"><b>'+esc(t(x.name,l))+'</b><span>'+esc(t(x.provider,l))+'</span><em>'+esc(t(x.dateLabel,l))+'</em></div>'}).join('');
var main=section(labels.about,'<p class="summary">'+esc(t(p.lede,l))+'</p>')+section(labels.scope,'<div class="scope">'+scope.map(function(x){return'<div class="chip">'+esc(x)+'</div>'}).join('')+'</div>')+section(labels.exp,jobs)+section(labels.cert,'<div class="certs">'+certs+'</div>');
return'<article class="page'+(ar?' sec-ar':'')+'" dir="'+(ar?'rtl':'ltr')+'">'+head+'<div class="grid"><div class="main">'+main+'</div><aside class="side">'+side+'</aside></div></article>'}
function sync(){var l=document.getElementById('mode').value;document.getElementById('out').innerHTML=render(l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';history.replaceState(null,'','?lang='+l)}
Promise.all(FILES.map(function(f){return fetch('data/'+f+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(f);return r.json()})})).then(function(a){FILES.forEach(function(f,i){D[f]=a[i]});var q=new URLSearchParams(location.search).get('lang');if(q==='ar'||q==='en')document.getElementById('mode').value=q;sync();document.getElementById('mode').onchange=sync}).catch(function(e){document.getElementById('out').innerHTML='<div class="page"><h1>Could not load CV data</h1><p>'+esc(e.message)+'</p></div>'});
})();
</script></body></html>
